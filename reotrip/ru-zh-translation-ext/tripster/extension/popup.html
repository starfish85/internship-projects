<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Tripster 俄译中</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Tripster 俄译中</h1>
    <p>词典优先 · 面向运营看站 · 不是 Sputnik8</p>
  </header>
  <label class="row">
    <span>开启翻译</span>
    <input type="checkbox" id="enabled" />
  </label>
  <label class="row">
    <span>词典命中高亮</span>
    <input type="checkbox" id="highlight" />
  </label>
  <p class="hint">绿框 = 词典/规则，橙框 = 正文机翻。改词请编辑 <code>tripster/extension/data/dictionary.json</code> 后刷新扩展和页面。</p>
  <script src="popup.js"></script>
</body>
</html>
