<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>NOL 韩译中</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 12px 14px;
      width: 300px;
      color: #1a1a1a;
      background: #fafafa;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 8px;
    }
    p {
      font-size: 12px;
      line-height: 1.45;
      margin: 0 0 8px;
      color: #444;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 10px 0;
      font-size: 12px;
    }
    button {
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    button.primary {
      background: #4f46e5;
      border-color: #4f46e5;
      color: #fff;
    }
    #status {
      font-size: 11px;
      color: #666;
      margin-top: 8px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>NOL 合作后台 · 全页简体</h1>
  <p>把页面上所有非简体中文（韩文商品名、繁体 UI、机翻）覆盖成业务简体。含列表标题；对抗 SPA 重渲染会持续重扫。不改服务端数据；正在编辑的输入框不打断。</p>
  <div class="row">
    <label>
      <input type="checkbox" id="enabled" checked />
      启用翻译
    </label>
  </div>
  <div class="row">
    <label>
      <input type="checkbox" id="online" checked />
      在线兜底翻译
    </label>
  </div>
  <div class="row">
    <button id="retranslate" class="primary">重新翻译本页</button>
    <button id="clearCache">清空在线缓存</button>
  </div>
  <div id="status">加载中…</div>
  <script src="popup.js"></script>
</body>
</html>
